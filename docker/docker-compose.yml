services:
  postgres:
    image: postgres:16
    container_name: oficina360-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: oficina360
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - oficina360-network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U oficina360 -d oficina360
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  oficina360-network:
    external: true